<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chr 9 Interactive RGB Animation</title>
    <style>
        body { margin: 0; background-color: #111; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .container { width: 95%; max-width: 1300px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); background: #000; padding: 20px; border-radius: 8px; }
        video { width: 100%; display: block; border-radius: 4px; outline: none; }
        .controls { margin-top: 15px; display: flex; justify-content: space-between; align-items: flex-start; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; color: black; font-weight: bold; background: #FF00FF; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        .legend { font-size: 15px; color: #ddd; line-height: 1.6; border-left: 3px solid #555; padding-left: 15px; }
        .magenta-text { color: #FF00FF; font-weight: bold; }
        .orange-text { color: #FFA500; font-weight: bold; }
        .yellow-text { color: #FFFF00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <video id="dataVideo" controls muted playsinline>
            <source src="Chr9_Scrolling_Animation.mp4" type="video/mp4">
        </video>
        <div class="controls">
            <button id="playBtn">Play Animation & Enable Sound</button>
            <div class="legend">
                <span class="magenta-text">■</span> Global Bonferroni Threshold: <b>7.0214</b><br>
                <span class="orange-text">■</span> Suggestive Threshold: <b>5.7204</b><br>
                <span class="yellow-text">■</span> Cohort Separator
            </div>
        </div>
    </div>

    <script>
        // --- Core Elements and Injected Variables ---
        const video = document.getElementById("dataVideo");
        const playBtn = document.getElementById("playBtn");
        
        // These placeholders (%s and %d) MUST exist for sprintf to work
        const triggerFrames = new Set([1,92,128,173,302]);
        const fps = 30;
        let audioCtx;
        
        // --- Audio Generation Logic ---
        function playBeep() {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(987.77, audioCtx.currentTime); // Note B5
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        }

        // --- Initialization and Play Control ---
        playBtn.addEventListener("click", () => {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === "suspended") { audioCtx.resume(); }
            video.muted = false;
            video.play();
            playBtn.innerText = "Playing... (Sound Active)";
            playBtn.style.background = "#00FF00";
        });

        let lastTriggeredFrame = -1;

        // --- High-Precision Frame Tracking Logic (requestAnimationFrame) ---
        // This ensures perfectly synced audio without skipping frames, and stops immediately on pause.
        function trackFrames() {
            if (!video.paused && !video.ended) {
                const currentFrame = Math.floor(video.currentTime * fps) + 1;
                
                if (triggerFrames.has(currentFrame) && currentFrame !== lastTriggeredFrame) {
                    playBeep();
                    lastTriggeredFrame = currentFrame;
                }
            }
            requestAnimationFrame(trackFrames);
        }
        
        // Start the continuous tracking loop
        requestAnimationFrame(trackFrames);
        
        // Reset the tracker if the user manually scrubs the timeline
        video.addEventListener("seeked", () => {
            lastTriggeredFrame = -1; 
        });
    </script>
</body>
</html>
