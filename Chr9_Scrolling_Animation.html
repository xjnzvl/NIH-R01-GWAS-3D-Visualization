<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chr 9 Interactive RGB Animation</title>
    <style>
        body { margin: 0; background-color: #111; color: white; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .container { width: 95%; max-width: 1300px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); background: #000; padding: 20px; border-radius: 8px; }
        video { width: 100%; display: block; border-radius: 4px; outline: none; }
        .controls { margin-top: 15px; display: flex; justify-content: space-between; align-items: flex-start; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border: none; border-radius: 5px; color: black; font-weight: bold; background: #FF00FF; transition: 0.3s; }
        button:hover { opacity: 0.8; }
        .legend { font-size: 15px; color: #ddd; line-height: 1.6; border-left: 3px solid #555; padding-left: 15px; }
        .magenta-text { color: #FF00FF; font-weight: bold; }
        .yellow-text { color: #FFFF00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <video id="dataVideo" controls loop muted playsinline>
            <source src="Chr9_Scrolling_Animation.mp4" type="video/mp4">
        </video>
        <div class="controls">
            <button id="playBtn">Play Animation & Enable Sound</button>
            <div class="legend">
                <span class="magenta-text">■</span> Global Bonferroni Threshold (Magenta Line): <b>7.0214</b><br>
                <span class="yellow-text">■</span> Suggestive Threshold (Yellow Line): <b>5.7204</b>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById("dataVideo");
        const playBtn = document.getElementById("playBtn");
        const triggerFrames = new Set([89,90,91,92,93,94,95,96,97,98,99,100,118,119,120,121,122,123,124,125,126,127,128,129,131,132,133,134,135,136,137,138,139,140,141,142,143,151,152,153,154,155,156,157,158,159,160,161,162,163,180,181,182,183,184,185,186,187,188,189,190,191,192,193,194,195,196,197,198,199,200,201,202,203,204,205,206,207,208,209,210,226,227,228,229,230,231,232,233,234,235,236,237,238,268,269,270,271,272,273,274,275,276,277,278,279,285,286,287,288,289,290,291,292,293,294,295,296,347,348,349,350,351,352,353,354,355,356,357,358,367,368,369,370,371,372,373,374,375,376,377,378,397,398,399,400,401,402,403,404,405,406,407,408,419,420,421,422,423,424,425,426,427,428,429,430,476,477,478,479,480,481,482,483,484,485,486,487,488,489,490,491,500,501,502,503,504,505,506,507,508,509,510,511,560,561,562,563,564,565,566,567,568,569,570,571,572,593,594,595,596,597,598,599,600,601,602,603,604,605,688,689,690,691,692,693,694,695,696,697,698,699,700,701,702,703,704,705,706,707,721,722,723,724,725,726,727,728,729,730,731,732,733,734,735,736,737,738,739,745,746,747,748,749,750]);
        const fps = 30;
        let audioCtx;
        
        function playBeep() {
            if (!audioCtx) return;
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            oscillator.type = "sine";
            oscillator.frequency.setValueAtTime(987.77, audioCtx.currentTime); // Note B5
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.01);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            oscillator.stop(audioCtx.currentTime + 0.2);
        }

        playBtn.addEventListener("click", () => {
            if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
            if (audioCtx.state === "suspended") { audioCtx.resume(); }
            video.muted = false; // Unmute native controls just in case
            video.play();
            playBtn.innerText = "Playing... (Sound Active)";
            playBtn.style.background = "#00FF00";
        });

        let lastTriggeredFrame = -1;

        // Reset the trigger logic if the user drags/scrubs the progress bar
        video.addEventListener("seeked", () => {
            lastTriggeredFrame = -1; 
        });

        video.addEventListener("timeupdate", () => {
            const currentFrame = Math.floor(video.currentTime * fps) + 1;
            if (triggerFrames.has(currentFrame) && currentFrame !== lastTriggeredFrame) {
                playBeep();
                lastTriggeredFrame = currentFrame;
            }
        });
    </script>
</body>
</html>
